<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pesticides & Crop Protection — Alhamad Trader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/output.css">
</head>

<body class="flex flex-col min-h-screen">
    <div id="navbar-mount"></div>

    <div class="bg-emerald-900 text-white py-10 px-4">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-3xl font-extrabold tracking-tight">Crop Protection & Pesticides</h1>
            <p class="text-emerald-200 text-xs mt-1">Insecticides, selective weedicides/herbicides, and fungicides.</p>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-1">
        <div class="flex flex-col md:flex-row gap-8">

            <!-- Filters Sidebar -->
            <aside class="w-full md:w-64 space-y-6">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 class="font-bold text-slate-900 text-xs uppercase tracking-wider mb-4">Pesticide Categories</h3>
                    <div class="space-y-2 text-xs font-semibold text-slate-700">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="subcat" value="" checked class="accent-emerald-700"
                                onchange="renderPesticides()"> All Pesticides
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="subcat" value="Insecticides" class="accent-emerald-700"
                                onchange="renderPesticides()"> Insecticides
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="subcat" value="Herbicides" class="accent-emerald-700"
                                onchange="renderPesticides()"> Herbicides
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="subcat" value="Fungicides" class="accent-emerald-700"
                                onchange="renderPesticides()"> Fungicides
                        </label>
                    </div>
                </div>

                <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-xs text-amber-900">
                    <strong>⚠️ Safety Reminder:</strong> Read instructions thoroughly before tank-mixing or spraying.
                </div>
            </aside>

            <!-- Products Grid -->
            <main class="flex-1">
                <div id="pesticideGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </main>

        </div>
    </div>

    <div id="footer-mount"></div>


    <script>
        function renderPesticides() {
            const urlParams = new URLSearchParams(window.location.search);
            const search = urlParams.get('search')?.toLowerCase() || '';
            const subcat = document.querySelector('input[name="subcat"]:checked')?.value || '';

            let list = DataManager.getProducts().filter(p => p.category === 'Pesticides');

            if (subcat) list = list.filter(p => p.subcategory === subcat);
            if (search) list = list.filter(p => p.name.toLowerCase().includes(search) || p.brand.toLowerCase().includes(search));

            const grid = document.getElementById('pesticideGrid');
            if (list.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">No matching pesticide products found.</div>`;
                return;
            }

            grid.innerHTML = list.map(p => `
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm card-hover flex flex-col justify-between">
          <div>
            <a href="product.html?id=${p.id}" class="block relative h-48 bg-slate-100 overflow-hidden">
              <img src="${p.image}" class="w-full h-full object-cover" />
              <span class="absolute top-2 left-2 bg-emerald-800 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">${p.subcategory}</span>
            </a>
            <div class="p-4">
              <div class="text-[10px] font-semibold text-slate-400 uppercase">${p.brand}</div>
              <a href="product.html?id=${p.id}" class="block font-bold text-slate-900 text-sm hover:text-emerald-700 mt-1 line-clamp-2">${p.name}</a>
              <div class="text-xs text-slate-500 mt-1">Package: <strong>${p.packageSize}</strong></div>
            </div>
          </div>
          <div class="p-4 pt-0">
            <div class="text-lg font-black text-emerald-900 mb-3">${formatPrice(p.discountPrice || p.price)}</div>
            <button onclick='Cart.addItem(DataManager.getProductById("${p.id}"))' class="w-full bg-emerald-800 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-xs transition">
              Add to Cart
            </button>
          </div>
        </div>
      `).join('');
        }

        document.addEventListener('DOMContentLoaded', renderPesticides);
    </script>
    <script src="data.js"></script>
    <script src="cart.js"></script>
    <script src="main.js"></script>
</body>

</html>
