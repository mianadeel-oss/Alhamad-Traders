<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details — Alhamad Trader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/output.css">
</head>

<body class="flex flex-col min-h-screen">
    <div id="navbar-mount"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full" id="detailContainer"></main>

    <div id="footer-mount"></div>


    <script>
        let product = null;

        document.addEventListener('DOMContentLoaded', () => {
            const id = new URLSearchParams(window.location.search).get('id');
            product = DataManager.getProductById(id);

            const container = document.getElementById('detailContainer');
            if (!product) {
                container.innerHTML = `
          <div class="text-center py-20">
            <h2 class="text-xl font-bold">Product not found</h2>
            <a href="index.html" class="text-emerald-700 font-bold mt-2 inline-block">Return Home</a>
          </div>
        `;
                return;
            }

            document.title = `${product.name} — Alhamad Trader`;

            container.innerHTML = `
        <div class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm p-6 md:p-10 mb-12">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="rounded-2xl overflow-hidden bg-slate-100 aspect-square border border-slate-100">
              <img src="${product.image}" class="w-full h-full object-cover" />
            </div>

            <div class="flex flex-col justify-between">
              <div>
                <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-0.5 rounded-full uppercase">${product.category}</span>
                <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 mt-2">${product.name}</h1>
                <p class="text-xs font-bold text-slate-400 uppercase mt-1">Brand: <span class="text-slate-800">${product.brand}</span></p>

                <div class="my-6 p-4 rounded-2xl bg-emerald-50 border border-emerald-100 flex items-baseline gap-3">
                  <span class="text-3xl font-black text-emerald-950">${formatPrice(product.discountPrice || product.price)}</span>
                  ${product.discountPrice ? `<span class="text-sm line-through text-slate-400">${formatPrice(product.price)}</span>` : ''}
                  <span class="text-xs font-bold text-emerald-700 ml-auto">Stock: ${product.stock} units</span>
                </div>

                <div class="text-xs text-slate-600 space-y-3 mb-6">
                  <p>${product.description}</p>
                  <div class="bg-slate-50 p-2.5 rounded-lg border"><strong>Package Size:</strong> ${product.packageSize}</div>
                </div>

                <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs text-amber-900 mb-6">
                  <strong>⚠️ Safety & Usage Notice:</strong> ${product.safetyInstructions}
                </div>
              </div>

              <div class="flex items-center gap-4 pt-4 border-t">
                <input id="qtyPicker" type="number" value="1" min="1" max="${product.stock}" class="w-16 text-center border rounded-xl py-3 font-bold text-sm bg-slate-50" />
                <button onclick="addToCartDetail()" class="flex-1 bg-emerald-800 hover:bg-emerald-700 text-white font-bold py-3.5 px-6 rounded-xl text-xs transition">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
        });

        function addToCartDetail() {
            const qty = parseInt(document.getElementById('qtyPicker').value) || 1;
            Cart.addItem(product, qty);
        }
    </script>
    <script src="data.js"></script>
    <script src="cart.js"></script>
    <script src="main.js"></script>
</body>

</html>
