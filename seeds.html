<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certified Crop Seeds — Alhamad Trader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/output.css">
</head>

<body class="flex flex-col min-h-screen">
  <div id="navbar-mount"></div>

  <div class="bg-emerald-900 text-white py-10 px-4">
    <div class="max-w-7xl mx-auto">
      <h1 class="text-3xl font-extrabold tracking-tight">Certified Agricultural Seeds</h1>
      <p class="text-emerald-200 text-xs mt-1">High germination varieties: Maize, Mustard, Rice & Wheat.</p>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-1">

    <!-- 4 Subcategory Filter Buttons -->
    <div class="flex flex-wrap gap-2 mb-8 border-b border-slate-200 pb-4">
      <button onclick="filterSeeds('')"
        class="seed-btn px-4 py-2 rounded-xl font-bold text-xs bg-emerald-800 text-white">All Seeds</button>
      <button onclick="filterSeeds('Maize Seeds')"
        class="seed-btn px-4 py-2 rounded-xl font-bold text-xs bg-white text-slate-700 border border-slate-200 hover:bg-emerald-50">🌽
        Maize Seeds</button>
      <button onclick="filterSeeds('Mustard Seeds')"
        class="seed-btn px-4 py-2 rounded-xl font-bold text-xs bg-white text-slate-700 border border-slate-200 hover:bg-emerald-50">🌼
        Mustard Seeds</button>
      <button onclick="filterSeeds('Rice Seeds')"
        class="seed-btn px-4 py-2 rounded-xl font-bold text-xs bg-white text-slate-700 border border-slate-200 hover:bg-emerald-50">🌾
        Rice Seeds</button>
      <button onclick="filterSeeds('Wheat Seeds')"
        class="seed-btn px-4 py-2 rounded-xl font-bold text-xs bg-white text-slate-700 border border-slate-200 hover:bg-emerald-50">🍞
        Wheat Seeds</button>
    </div>

    <!-- Seeds Grid -->
    <div id="seedsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
  </div>

  <div id="footer-mount"></div>


  <script>
    let currentFilter = '';

    function filterSeeds(subcat) {
      currentFilter = subcat;
      document.querySelectorAll('.seed-btn').forEach(b => {
        b.className = 'seed-btn px-4 py-2 rounded-xl font-bold text-xs bg-white text-slate-700 border border-slate-200 hover:bg-emerald-50';
      });
      event.target.className = 'seed-btn px-4 py-2 rounded-xl font-bold text-xs bg-emerald-800 text-white';
      renderSeeds();
    }

    function renderSeeds() {
      let list = DataManager.getProducts().filter(p => p.category === 'Seeds');
      if (currentFilter) list = list.filter(p => p.subcategory === currentFilter);

      const grid = document.getElementById('seedsGrid');
      grid.innerHTML = list.map(seed => `
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm card-hover flex flex-col justify-between">
          <div>
            <a href="product.html?id=${seed.id}" class="block relative h-48 bg-slate-100 overflow-hidden">
              <img src="${seed.image}" class="w-full h-full object-cover" />
              <span class="absolute top-2 left-2 bg-emerald-700 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">${seed.subcategory}</span>
            </a>
            <div class="p-4">
              <span class="text-[10px] font-semibold text-slate-400 uppercase">${seed.brand}</span>
              <a href="product.html?id=${seed.id}" class="block font-bold text-slate-900 text-sm hover:text-emerald-700 mt-1 line-clamp-2">${seed.name}</a>
              <div class="text-xs text-slate-500 mt-1">Weight: <strong>${seed.packageSize}</strong></div>
              <div class="text-xs text-emerald-700 font-semibold mt-1">✓ High Germination Tested</div>
            </div>
          </div>
          <div class="p-4 pt-0">
            <div class="text-lg font-black text-emerald-900 mb-3">${formatPrice(seed.discountPrice || seed.price)}</div>
            <button onclick='Cart.addItem(DataManager.getProductById("${seed.id}"))' class="w-full bg-emerald-800 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-xs transition">
              Add to Cart
            </button>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderSeeds);
  </script>
  <script src="data.js"></script>
  <script src="cart.js"></script>
  <script src="main.js"></script>
</body>

</html>
