<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart — Alhamad Trader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/output.css">
</head>

<body class="flex flex-col min-h-screen">
    <div id="navbar-mount"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full">
        <h1 class="text-3xl font-extrabold text-slate-900 mb-8">Shopping Cart</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-4" id="cartItemsList"></div>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm h-fit space-y-4">
                <h3 class="font-bold text-slate-900 text-xs uppercase tracking-wider border-b pb-3">Order Summary</h3>
                <div class="flex justify-between text-xs text-slate-600">
                    <span>Subtotal</span>
                    <span id="cSubtotal" class="font-bold text-slate-900">Rs. 0</span>
                </div>
                <div class="border-t pt-3 flex justify-between text-base font-extrabold">
                    <span>Total</span>
                    <span id="cTotal" class="text-emerald-900 text-xl font-black">Rs. 0</span>
                </div>
                <a href="checkout.html"
                    class="block w-full bg-emerald-800 hover:bg-emerald-700 text-white font-bold py-3.5 text-center rounded-xl text-xs transition">
                    Proceed to Checkout &rarr;
                </a>
            </div>
        </div>
    </div>

    <div id="footer-mount"></div>


    <script>
        function renderCart() {
            const cart = Cart.getCart();
            const list = document.getElementById('cartItemsList');

            if (cart.length === 0) {
                list.innerHTML = `
          <div class="bg-white p-12 rounded-2xl border text-center space-y-3">
            <div class="text-4xl">🛒</div>
            <h3 class="font-bold">Your cart is empty</h3>
            <a href="pesticides.html" class="inline-block bg-emerald-800 text-white font-bold text-xs px-5 py-2.5 rounded-xl">Browse Catalog</a>
          </div>
        `;
                document.getElementById('cSubtotal').textContent = 'Rs. 0';
                document.getElementById('cTotal').textContent = 'Rs. 0';
                return;
            }

            const total = Cart.getSubtotal();
            document.getElementById('cSubtotal').textContent = formatPrice(total);
            document.getElementById('cTotal').textContent = formatPrice(total);

            list.innerHTML = cart.map(item => `
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-4">
          <div class="flex items-center gap-3">
            <img src="${item.image}" class="w-14 h-14 rounded-lg object-cover" />
            <div>
              <h4 class="font-bold text-xs text-slate-900">${item.name}</h4>
              <span class="text-[10px] text-slate-400">${item.packageSize}</span>
              <div class="text-xs font-black text-emerald-800">${formatPrice(item.price)}</div>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <div class="flex items-center border rounded-lg bg-slate-50 text-xs">
              <button onclick="changeQty('${item.id}', -1)" class="px-2 py-1 font-bold">-</button>
              <span class="w-8 text-center font-bold">${item.quantity}</span>
              <button onclick="changeQty('${item.id}', 1)" class="px-2 py-1 font-bold">+</button>
            </div>
            <span class="font-bold text-xs w-20 text-right">${formatPrice(item.price * item.quantity)}</span>
            <button onclick="removeItem('${item.id}')" class="text-red-500 font-bold text-xs">✕</button>
          </div>
        </div>
      `).join('');
        }

        function changeQty(id, delta) {
            Cart.updateQuantity(id, delta);
            renderCart();
        }

        function removeItem(id) {
            Cart.removeItem(id);
            renderCart();
        }

        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
    <script src="data.js"></script>
    <script src="cart.js"></script>
    <script src="main.js"></script>
</body>

</html>
